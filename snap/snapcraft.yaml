name: qwen3
base: core24
summary: Qwen 3 inference snap
description: |
  Qwen 3 is a large language model (LLM) developed by Alibaba.
  It is designed for various natural language processing tasks, including text
  generation, summarization, and question answering.

  This snap lets you run Qwen 3 locally.

  Before you start, make sure to have the necessary drivers installed on the host:
  https://documentation.ubuntu.com/inference-snaps/how-to/install-drivers/

  **Install:**
  
  `sudo snap install qwen3`
  
  **Get help:**
  
  `qwen3 --help`
  
  **Licensing:**
  
  The Qwen 3 model is provided by Alibaba under the Apache 2.0 license.

  The licenses of all bundled software can be found inside the snap at `/snap/qwen3/current/usr/share/doc`.

website: https://documentation.ubuntu.com/inference-snaps
source-code: https://github.com/canonical/qwen3-snap
issues: https://github.com/canonical/inference-snaps/issues

adopt-info: version

grade: stable
confinement: strict
compression: lzo

assumes:
  - snapd2.68 # for components support

platforms:
  amd64:
  arm64:

slots:
  status:
    interface: content
    source:
      read:
        - &status-share $SNAP_DATA/share/status
  open-webui:
    interface: content
    content: open-webui-config
    source:
      read:
        - &owui-share $SNAP_DATA/share/open-webui
plugs:
  mediatek-npu-2404:
    interface: content
    content: mediatek-npu-2404
    target: $SNAP/mediatek-npu-2404
  mediatek-accel:
    interface: mediatek-accel
    units: [apu]
  # To allow side-loading models into server (root daemon) from user home directory
  home:
    read: all

environment:
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR
  STATUS_SHARE: *status-share # Status directory shared via content interface
  OWUI_SHARE: *owui-share # Open WebUI config directory shared via content interface

layout:
  # Under wsl the libraries are expected in /usr/lib/wsl
  /usr/lib/wsl:
    bind: $SNAP_COMMON/usr/lib/wsl

hooks:
  install:
    plugs: &install-plugs
      # For hardware detection
      - hardware-observe
      - opengl
  post-refresh:
    plugs: *install-plugs

parts:
  version:
    after: [cli]
    plugin: nil
    source: . # To regenerate the git hash on every change
    build-packages:
      - jq
      - git
    override-pull: |
      # Do nothing. This significantly reduces build time when sourcing large files.
    override-build: |
      set -eo pipefail
      cli_version=$($CRAFT_STAGE/bin/modelctl version --format=json | jq .cli --raw-output)
      git_hash=$(git -C "$SNAPCRAFT_PROJECT_DIR" describe --always)
      craftctl set version="${cli_version#v}+${git_hash}"

  cli:
    source:
      - on amd64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.12/inference-snaps-cli-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.12/inference-snaps-cli-linux-arm64.tar.xz
    plugin: dump
    override-build: |
      # For tab completion
      ln --symbolic ./modelctl bin/qwen3

      craftctl default
    
  cli-lspci:
    plugin: nil
    stage-packages:
      - pciutils # lspci

  # Used for NVIDIA vRAM and CUDA Capability detection.
  # Only the binary is included to avoid staging libraries, which should instead be provided by the host through the opengl interface.
  cli-nvidia-smi:
    plugin: nil
    build-packages:
      - nvidia-utils-580
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      cp /usr/bin/nvidia-smi $CRAFT_PART_INSTALL/usr/bin/
      
      license_dir=$CRAFT_PART_INSTALL/usr/share/doc/nvidia-utils-580/
      mkdir -p $license_dir
      cp /usr/share/doc/nvidia-utils-580/copyright $license_dir/

  webui:
    plugin: dump
    source: https://github.com/canonical/inference-snaps-webui/releases/download/v1.1.0/inference-snaps-webui.tar.xz
    organize:
      "*": webui/

  engines:
    source: engines
    plugin: dump
    organize:
      "*": engines/

  models:
    source: models
    plugin: dump
    organize:
      "*": models/

  runtimes:
    source: runtimes
    plugin: dump
    organize:
      "*": runtimes/
    prime:
      # The mediatek-llm-proxy runtime's code is built and shipped by the
      # mediatek-llm-proxy part below, not dumped as raw source here.
      - -runtimes/mediatek-llm-proxy/model-server
      - -runtimes/mediatek-llm-proxy/requirements.txt
      - -runtimes/mediatek-llm-proxy/.venv
  
  scripts:
    source: scripts
    plugin: dump
    stage-packages:
      - jq
    organize:
      "server.sh": bin/
      "server-webui.sh": bin/
      "export-shared-configs.sh": bin/

  local-component-files:
    plugin: cmake # an out-of-source plugin to reduce copies on disk
    source: components
    override-build:
      cp -rf --archive --link --no-dereference ${CRAFT_PART_SRC}/* ${CRAFT_PART_INSTALL}
    organize:
      "llamacpp/*": (component/llamacpp)
      "llamacpp-cuda/*": (component/llamacpp-cuda)
      "llamacpp-rocm/*": (component/llamacpp-rocm)
      "model-8b-q4-k-m-gguf/*": (component/model-8b-q4-k-m-gguf)

    prime:
      # Exclude everything not explicitly organized
      - -*

  llamacpp:
    plugin: dump
    source: 
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/b9482/llamacpp-amd64.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/b9482/llamacpp-arm64.tar.gz
    stage-packages:
      - libgomp1
    organize:
      "licenses": usr/share/doc/llama.cpp # Add licenses to the snap
      "*": (component/llamacpp)
    
  llamacpp-cuda:
    plugin: dump
    source: 
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/b9482/llamacpp-amd64+cuda12.9.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/b9482/llamacpp-arm64+cuda12.9.tar.gz
    stage-packages:
      - libgomp1
    organize:
      "licenses": usr/share/doc/llama.cpp+cuda # Add licenses to the snap
      "*": (component/llamacpp-cuda)

  llamacpp-rocm:
    plugin: dump
    source: https://github.com/canonical/llama.cpp-builds/releases/download/b9482/llamacpp-amd64+rocm.tar.gz
    stage-packages:
      - libgomp1
      - libatomic1
    organize:
      "licenses": usr/share/doc/llama.cpp+rocm # Add licenses to the snap
      "*": (component/llamacpp-rocm)
    # This part is only for amd64
    override-pull: &amd64-only |
      [ "$CRAFT_ARCH_BUILD_FOR" == "amd64" ] && craftctl default || exit 0
    override-build: *amd64-only
    override-stage: *amd64-only
    override-prime: *amd64-only

  mediatek-llm-proxy:
    plugin: python
    source: runtimes/mediatek-llm-proxy
    python-requirements:
      - requirements.txt
    override-build: |
      craftctl default
      install -Dm644 -t $CRAFT_PART_INSTALL/model-server $CRAFT_PART_BUILD/model-server/*
    organize:
      "*": (component/mediatek-llm-proxy)

  model-0-6b-mediatek:
    plugin: dump
    source: components/model-0-6b-mediatek
    organize:
      "config.yaml": (component/model-0-6b-mediatek)/config.yaml
      "2048c/*": (component/model-0-6b-mediatek)/2048c/
      "tokenizer/*": (component/model-0-6b-mediatek)/tokenizer/

  model-1-7b-mediatek:
    plugin: dump
    source: components/model-1-7b-mediatek
    organize:
      "config.yaml": (component/model-1-7b-mediatek)/config.yaml
      "2048c/*": (component/model-1-7b-mediatek)/2048c/
      "tokenizer/*": (component/model-1-7b-mediatek)/tokenizer/

  model-4b-mediatek:
    plugin: dump
    source: components/model-4b-mediatek
    organize:
      "config.yaml": (component/model-4b-mediatek)/config.yaml
      "2048c/*": (component/model-4b-mediatek)/2048c/
      "tokenizer/*": (component/model-4b-mediatek)/tokenizer/

  model-8b-mediatek:
    plugin: dump
    source: components/model-8b-mediatek
    organize:
      "config.yaml": (component/model-8b-mediatek)/config.yaml
      "2048c/*": (component/model-8b-mediatek)/2048c/
      "tokenizer/*": (component/model-8b-mediatek)/tokenizer/

  notice:
    plugin: nil
    source: NOTICE
    source-type: file
    override-build: |
      license_dir=$CRAFT_PART_INSTALL/usr/share/doc
      mkdir -p $license_dir
      cp NOTICE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE-qwen3 $license_dir/

components:
  model-8b-q4-k-m-gguf:
    type: standard
    summary: Qwen 3 8B Q4_K_M GGUF
    description: Model weights for Qwen 3 8B in GGUF format
  model-0-6b-mediatek:
    type: standard
    summary: MediaTek optimized Qwen3 0.6B model for MediaTek Genio NPU
    description: Model weights for MediaTek optimized Qwen3 0.6B model in DLA format, designed for inference on MediaTek Genio NPU
  model-1-7b-mediatek:
    type: standard
    summary: MediaTek optimized Qwen3 1.7B model for MediaTek Genio NPU
    description: Model weights for MediaTek optimized Qwen3 1.7B model in DLA format, designed for inference on MediaTek Genio NPU
  model-4b-mediatek:
    type: standard
    summary: MediaTek optimized Qwen3 4B model for MediaTek Genio NPU
    description: Model weights for MediaTek optimized Qwen3 4B model in DLA format, designed for inference on MediaTek Genio NPU
  model-8b-mediatek:
    type: standard
    summary: MediaTek optimized Qwen3 8B model for MediaTek Genio NPU
    description: Model weights for MediaTek optimized Qwen3 8B model in DLA format, designed for inference on MediaTek Genio NPU

  llamacpp:
    type: standard
    summary: llama.cpp using default CPU instruction sets
    description: LLM inference in C/C++

  llamacpp-cuda:
    type: standard
    summary: llama.cpp with CUDA backend
    description: LLM inference in C/C++

  llamacpp-rocm:
    type: standard
    summary: llama.cpp with ROCm backend
    description: LLM inference in C/C++

  mediatek-llm-proxy:
    type: standard
    summary: LLM proxy server for MediaTek Genio NPU
    description: An OpenAI-compatible proxy server that runs MediaTek optimized models on the MediaTek Genio NPU via llm_cmdline_tool

apps:
  qwen3:
    command: bin/modelctl
    completer: bin/snap-completer.bash
    plugs:
      - hardware-observe
      - opengl
      - network
      - desktop # To open the webui in the browser
    environment:
      ADDITIONAL_FEATURES: chat, webui

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      - network-bind
      - hardware-observe
      - opengl
      - process-control
      - home
      # get the supported shared libraries for MediaTek NPU inference
      - mediatek-npu-2404
      # grants access to the NPU device
      - mediatek-accel

  server-webui:
    command: bin/server-webui.sh
    daemon: simple
    plugs:
      - network-bind
