name: qwen3-4b-mediatek
description: |
  Qwen3 4B compiled to MediaTek NeuroPilot DLA format for accelerated
  inference on the MediaTek Genio NPU.
quantization: DLA INT16
disk-size: 7G
capabilities:
  - text
components:
  - model-4b-mediatek-1-of-2
  - model-4b-mediatek-2-of-2
environment:
  - MODEL_ID=qwen3-4b-mediatek
  - MODEL_MAX_TOKENS=10240

# The model is split across two components because it exceeds the maximum 
# allowed component size. The layout below is such that config.yaml 
# (which expects one $SNAP_COMPONENT_DIR) keeps working unmodified.
# Each entry must be a leaf file (not a whole directory) because
# components are mounted read-only, so a symlink can't be nested inside
# another symlinked directory.
layout:
  /tmp/qwen3-4b-mediatek/config.yaml:
    symlink: $SNAP_COMPONENTS/model-4b-mediatek-1-of-2/config.yaml
  /tmp/qwen3-4b-mediatek/tokenizer/vocab.txt:
    symlink: $SNAP_COMPONENTS/model-4b-mediatek-1-of-2/tokenizer/vocab.txt
  /tmp/qwen3-4b-mediatek/tokenizer/merges.txt:
    symlink: $SNAP_COMPONENTS/model-4b-mediatek-1-of-2/tokenizer/merges.txt
  /tmp/qwen3-4b-mediatek/tokenizer/added_tokens.yaml:
    symlink: $SNAP_COMPONENTS/model-4b-mediatek-1-of-2/tokenizer/added_tokens.yaml
  /tmp/qwen3-4b-mediatek/tokenizer/embedding_int16.bin:
    symlink: $SNAP_COMPONENTS/model-4b-mediatek-1-of-2/tokenizer/embedding_int16.bin
  /tmp/qwen3-4b-mediatek/2048c/shared_weights_0.bin:
    symlink: $SNAP_COMPONENTS/model-4b-mediatek-1-of-2/2048c/shared_weights_0.bin
  /tmp/qwen3-4b-mediatek/2048c/dynamic_tflite_output_128t2048c_0.dla:
    symlink: $SNAP_COMPONENTS/model-4b-mediatek-2-of-2/2048c/dynamic_tflite_output_128t2048c_0.dla
  /tmp/qwen3-4b-mediatek/2048c/dynamic_tflite_output_128t2048c_0_shared.dla:
    symlink: $SNAP_COMPONENTS/model-4b-mediatek-2-of-2/2048c/dynamic_tflite_output_128t2048c_0_shared.dla
  /tmp/qwen3-4b-mediatek/2048c/dynamic_tflite_output_1t2048c_0.dla:
    symlink: $SNAP_COMPONENTS/model-4b-mediatek-2-of-2/2048c/dynamic_tflite_output_1t2048c_0.dla
  /tmp/qwen3-4b-mediatek/2048c/dynamic_tflite_output_1t2048c_0_shared.dla:
    symlink: $SNAP_COMPONENTS/model-4b-mediatek-2-of-2/2048c/dynamic_tflite_output_1t2048c_0_shared.dla
